name: Check PR health

on: [pull_request]

jobs:
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Install Node
      uses: actions/setup-node@v4.0.2
      with:
        node-version: 20.x
        cache: "npm"

    - name: Install packages
      run: npm ci
    
    - name: Check linting
      run: npm run lint
